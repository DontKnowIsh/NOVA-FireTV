name: Build NOVA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout NOVA source
        uses: actions/checkout@v5

      - name: Fetch Jellyfin Android TV v0.19.10
        run: |
          git clone --depth 1 --branch v0.19.10 https://github.com/jellyfin/jellyfin-androidtv.git jellyfin-src

      - name: Apply NOVA changes
        run: |
          cp -R custom/app/. jellyfin-src/app/
          mkdir -p jellyfin-src/app/src/main/res/drawable-nodpi
          cp assets/*.png assets/*.jpg jellyfin-src/app/src/main/res/drawable-nodpi/
          python3 tools/apply_customizations.py
          python3 tools/finalize_setup.py
          python3 tools/finalize_preview_audio.py
          python3 tools/finalize_home_playback.py
          python3 tools/finalize_nova_extras.py

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Official builds are signed with the key kept in this repository's secrets,
      # so updates install over the top. Forks without those secrets get a
      # throwaway key: their APK installs fine, but not over an official build.
      - name: Signing key
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -n "$NOVA_KEYSTORE_BASE64" ]; then
            echo "$NOVA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova.jks"
            {
              echo "NOVA_KEYSTORE_PASSWORD=$NOVA_KEYSTORE_PASSWORD"
              echo "NOVA_KEY_ALIAS=$NOVA_KEY_ALIAS"
              echo "NOVA_KEY_PASSWORD=$NOVA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nova.jks" -alias nova -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=NOVA fork build" >/dev/null
            echo "::add-mask::$PASS"
            {
              echo "NOVA_KEYSTORE_PASSWORD=$PASS"
              echo "NOVA_KEY_ALIAS=nova"
              echo "NOVA_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: jellyfin-src
        env:
          NOVA_VERSION: "1.2.0"
        run: |
          ./gradlew assembleRelease -Pjellyfin.version=$NOVA_VERSION \
            -Pkeystore.file=$RUNNER_TEMP/nova.jks -Pkeystore.password=$NOVA_KEYSTORE_PASSWORD \
            -Psigning.key.alias=$NOVA_KEY_ALIAS -Psigning.key.password=$NOVA_KEY_PASSWORD

      - name: Collect APK and source
        run: |
          mkdir -p output
          APK="$(find jellyfin-src/app/build/outputs/apk/release -type f -iname "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" output/NOVA-FireTV.apk
          # The exact patched source this APK was built from (GPL-2.0).
          tar --exclude='*/build' --exclude='.git' --exclude='.gradle' -czf output/NOVA-FireTV-source.tar.gz jellyfin-src

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: NOVA-FireTV
          retention-days: 30
          if-no-files-found: error
          path: |
            output/NOVA-FireTV.apk
            output/NOVA-FireTV-source.tar.gz

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/NOVA-FireTV.apk output/NOVA-FireTV-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "NOVA $GITHUB_REF_NAME" --generate-notes
